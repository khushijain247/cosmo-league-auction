<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COSMO LEAGUE 4.0-2026</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0a0d14;--panel:#121722;--panel2:#1a2130;--line:#263047;--text:#eef2fa;--mut:#8b97b0;--acc:#c6ff3d;--acc-ink:#10150a;--ok:#2ee59d;--bad:#ff5470;
--head:'Barlow Condensed','Arial Narrow',Impact,sans-serif;--body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(1200px 500px at 70% -10%,#16203a,transparent),var(--bg);color:var(--text);font:15px/1.45 var(--body);min-height:100vh}
button,input,select{font:inherit;color:inherit}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding:18px clamp(14px,3vw,32px);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:rgba(10,13,20,.9);backdrop-filter:blur(10px);z-index:20}
.brand{font:700 30px/1 var(--head);letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.live{font:600 12px var(--body);letter-spacing:.1em;color:var(--bad);display:flex;align-items:center;gap:6px}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--bad);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.8)}}
.stats{display:flex;gap:22px;flex-wrap:wrap}
.stat b{display:block;font:700 26px/1 var(--head);color:var(--acc)}
.stat span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:600;transition:.15s}
.btn:hover{border-color:var(--mut);transform:translateY(-1px)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-size:15px}
.btn.ok{background:var(--ok);color:#04150e;border-color:var(--ok)}
.btn.bad{background:transparent;color:var(--bad);border-color:var(--bad)}
main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);gap:20px;padding:20px clamp(14px,3vw,32px) 40px}
@media(max-width:980px){main{grid-template-columns:1fr}}
h2{font:700 20px var(--head);letter-spacing:.08em;text-transform:uppercase;margin:0 0 12px;color:var(--mut)}
#teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;align-content:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;border-top:4px solid var(--c);transition:.25s}
.card.flash{animation:flash 1s}
@keyframes flash{0%{box-shadow:0 0 0 2px var(--c),0 0 30px var(--c)}100%{box-shadow:none}}
.card h3{margin:0;font:700 24px var(--head);letter-spacing:.03em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rem{font:700 28px var(--head);color:var(--c)}
.rem small{display:block;font:500 10px var(--body);color:var(--mut);letter-spacing:.1em;text-align:right}
.m{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.m div{background:var(--panel2);border-radius:10px;padding:8px 10px}
.m span{display:block;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.m b{font-size:16px}
.bar{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.pct{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin:6px 0 8px}
details summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--mut);padding:6px 0;list-style:none}
details summary::before{content:"▸ ";transition:.2s;display:inline-block}
details[open] summary::before{transform:rotate(90deg)}
.ros{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.ros li{display:flex;justify-content:space-between;gap:8px;background:var(--panel2);padding:6px 10px;border-radius:8px;font-size:13px}
.ros em{font-style:normal;color:var(--acc);font-weight:600}
.empty{color:var(--mut);font-size:13px;padding:6px 0}
.feedbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px)}
.tools{display:grid;gap:8px;margin-bottom:10px}
input,select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:13px;font-weight:600;color:var(--mut)}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
#feed{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-height:62vh;overflow-y:auto}
#feed li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--panel2);border-radius:12px;padding:10px 12px;border-left:4px solid var(--c,var(--line))}
#feed li.new{animation:slide .5s}
@keyframes slide{from{opacity:0;transform:translateY(-12px)}}
.tag{font:700 12px var(--head);letter-spacing:.1em;padding:3px 8px;border-radius:6px}
.tag.sold{background:rgba(46,229,157,.15);color:var(--ok)}
.tag.unsold{background:rgba(255,84,112,.15);color:var(--bad)}
.tm{color:var(--mut);font-size:12px;white-space:nowrap}
#veil{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.25s;z-index:30}
#veil.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:31;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));overflow-y:auto;display:grid;gap:12px;align-content:start}
#drawer.on{transform:none}
label{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em;display:block;margin-bottom:4px}
.price{font:700 54px/1 var(--head);color:var(--acc);text-align:center;padding:8px 0}
.incs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.info{font-size:13px;color:var(--mut);text-align:center;min-height:20px}
.info.err{color:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);background:var(--panel2);border:1px solid var(--acc);padding:10px 18px;border-radius:12px;opacity:0;transition:.3s;z-index:40;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
.nm{display:flex;align-items:center;gap:10px;min-width:0}.nm img{width:46px;height:46px;border-radius:10px;object-fit:cover;flex:none}.card h3{font-size:21px}.gm{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--mut);margin-bottom:10px;align-items:center}.gm span{background:var(--panel2);padding:3px 9px;border-radius:99px}.mini{margin-left:auto;padding:3px 10px;font-size:12px;border-radius:99px}
.badge{font:600 11px var(--body);letter-spacing:.1em;border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--mut)}.ro .actions,.ro .mini,.ro #drawer,.ro #veil{display:none!important}.incs{grid-template-columns:repeat(5,1fr)!important}.incs .btn{padding:10px 2px;font-size:13px}
.dlg{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.65);z-index:50;padding:16px}.dlg.on{display:grid}.dbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(400px,100%);display:grid;gap:12px}.dbox h2{font-size:22px;letter-spacing:.04em}
.ros li{align-items:center}.ros .mini{margin-left:6px}
</style>
</head>
<body>
<header>
  <div class="brand">COSMO LEAGUE 4.0-2026 <span class="live">LIVE</span><span class="badge" id="badge">CONNECTING…</span></div>

  <button class="btn" id="hostBtn" style="display:none">Host login</button>

</div>

"name": "Sunil Mehar", "age": 41, "g": "M", "base": 10000}, {"id": "p49", "name": "Sanjana Kothari", "age": 19, "g": "F", "base": 10000}, {"id": "p50", "name": "Sanskar Madan Munot", "age": 13, "g": "M", "base": 10000}, {"id": "p51", "name": "Mahaveer", "age": 40, "g": "M", "base": 10000}, {"id": "p52", "name": "Monica", "age": 38, "g": "F", "base": 10000}, {"id": "p53", "name": "Sheetal", "age": 34, "g": "F", "base": 10000}, {"id": "p54", "name": "Rajat", "age": 15, "g": "M", "base": 10000}],log:[]});
let S=seed(),DOC=null,canWrite=false,pend=false,writing=false;
function load(){let x=null;try{x=JSON.parse(localStorage.getItem(KEY))}catch(e){}S=x&&x.teams?x:seed()}
async function save(){
  if(!DOC){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}return}
  pend=true;if(writing)return;writing=true;
  while(pend){pend=false;try{await DOC(S)}catch(e){toast('Sync failed: '+((e&&e.code)||'error'))}}
  writing=false;
}
function setMode(l){document.body.classList.toggle('ro',!canWrite);$('#badge').textContent=l}
let filter='all',team='all',query='',open=new Set(),flashT=null,newId=null;

function derive(){
  const status={};
  [...S.log].reverse().forEach(l=>status[l.pid]=l);
  const tm={};S.teams.forEach(t=>tm[t.id]={...t,spent:0,roster:[],F:0,M:0,hasMax:false});
  S.players.forEach(p=>{const l=status[p.id];if(l&&l.type==='sold'&&tm[l.tid]){const t=tm[l.tid];t.spent+=l.price;t.roster.push({p,price:l.price});if(p.g==='F')t.F++;if(p.g==='M')t.M++;if(l.price>=MAXBID)t.hasMax=true}});
  return {status,tm};
}
const pName=id=>(S.players.find(p=>p.id===id)||{name:'Unknown'}).name;

function render(){
  const {status,tm}=derive();
  const sold=Object.values(status).filter(l=>l.type==='sold').length;
  const pool=S.players.filter(p=>!(status[p.id]&&status[p.id].type==='sold')).length;
  const spent=Object.values(tm).reduce((a,t)=>a+t.spent,0);
  $('#stats').innerHTML=[['Sold',sold],['Remaining',pool],['Total spent',short(spent)]].map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');
  $('#teams').innerHTML=Object.values(tm).map(t=>{
    const rem=t.budget-t.spent,pct=t.budget?Math.round(t.spent/t.budget*100):0;
    return `<div class="card${flashT===t.id?' flash':''}" style="--c:${t.color}" data-t="${t.id}">
      <h3><span class="nm">${LOGOS[t.id]?`<img src="${LOGOS[t.id]}" alt="">`:''}${esc(t.name)}</span><span class="rem">${short(rem)}<small>REMAINING</small></span></h3>
      <div class="m"><div><span>Budget</span><b>${short(t.budget)}</b></div><div><span>Spent</span><b>${short(t.spent)}</b></div><div><span>Squad</span><b>${t.roster.length}/${SQUAD}</b></div></div><div class="gm"><span>♀ ${t.F}/${FEM}</span><span>♂ ${t.M}/${MAL}</span><span>${t.hasMax?'★ Max bid used':'☆ Max bid available'}</span><button class="btn mini" data-b="${t.id}">Budget</button></div>
      <div class="bar"><i style="width:${pct}%"></i></div><div class="pct"><span>Budget used</span><span>${pct}%</span></div>
      <details data-t="${t.id}"${open.has(t.id)?' open':''}><summary>Squad (${t.roster.length})</summary>
      ${t.roster.length?`<ul class="ros">${t.roster.map(r=>`<li><span>${esc(r.p.name)} <small style="color:var(--mut)">${r.p.age}${r.p.g?' · '+r.p.g:''}</small></span><em>${full(r.price)}</em><button class="btn mini ed" data-e="${r.p.id}">Edit</button></li>`).join('')}</ul>`:'<div class="empty">No players yet.</div>'}</details></div>`}).join('');
  flashT=null;
  // team filter options
  const cur=team;$('#ft').innerHTML='<option value="all">All teams</option>'+S.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');$('#ft').value=cur;
  renderFeed();
  fillDrawer();
}
function renderFeed(){
  const q=query.toLowerCase();
  const rows=S.log.filter(l=>{
    if(filter!=='all'&&l.type!==filter)return false;
    if(team!=='all'&&l.tid!==team)return false;
    const tn=(S.teams.find(t=>t.id===l.tid)||{name:''}).name;
    return !q||(pName(l.pid)+' '+tn).toLowerCase().includes(q);
  });
  $('#feed').innerHTML=rows.length?rows.map(l=>{
    const t=S.teams.find(t=>t.id===l.tid);
    const txt=l.type==='sold'?`<b>${esc(pName(l.pid))}</b> bought by <b style="color:${t?t.color:'inherit'}">${esc(t?t.name:'?')}</b> for ${full(l.price)}`:`<b>${esc(pName(l.pid))}</b> went unsold`;
    return `<li class="${l.id===newId?'new':''}" style="--c:${l.type==='sold'&&t?t.color:'var(--bad)'}"><span class="tag ${l.type}">${l.type.toUpperCase()}</span><span>${txt}</span><span class="tm">${new Date(l.ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span></li>`}).join(''):'<li><span></span><span class="empty">No matching activity.</span></li>';
  newId=null;
}
/* drawer */
function available(){const {status}=derive();return S.players.filter(p=>!(status[p.id]&&status[p.id].type==='sold'))}
function fillDrawer(){
  const av=available(),f=$('#ps').value.toLowerCase(),cur=$('#pl').value;
  const list=av.filter(p=>(p.name+' '+p.role).toLowerCase().includes(f));
  $('#poolN').textContent=av.length;
  $('#pl').innerHTML=list.length?list.map(p=>`<option value="${p.id}">${esc(p.name)} · ${p.age} · ${p.g||'gender ?'}</option>`).join(''):'<option value="">No players available</option>';
  if(list.some(p=>p.id===cur))$('#pl').value=cur;
  const ct=$('#tm').value;
  $('#tm').innerHTML=Object.values(derive().tm).map(t=>`<option value="${t.id}">${esc(t.name)} (${short(t.budget-t.spent)} left)</option>`).join('');
  if(ct)$('#tm').value=ct;
  check();
}
function setPrice(v){$('#price').value=v;check()}
function check(){
  const v=+$('#price').value||0,t=derive().tm[$('#tm').value],p=S.players.find(p=>p.id===$('#pl').value);
  $('#priceTxt').textContent=full(v);
  $('#gF').classList.toggle('pri',!!p&&p.g==='F');$('#gM').classList.toggle('pri',!!p&&p.g==='M');
  let msg='',err=false;const bad=m=>{msg=m;err=true};
  if(t){
    const left=t.budget-t.spent,slots=SQUAD-t.roster.length-1;
    msg=`${t.name}: ${full(left)} left · ${t.roster.length}/${SQUAD} players`;
    if(t.roster.length>=SQUAD)bad('Squad is full (11 players)');
    else if(v>left)bad(`Over budget by ${full(v-left)}`);
    else if(left-v<slots*BASE)bad(`Must keep ${full(slots*BASE)} for ${slots} remaining slot(s)`);
    else if(p&&p.g==='F'&&t.F>=FEM)bad('Team already has 4 females');
    else if(p&&p.g==='M'&&t.M>=MAL)bad('Team already has 7 males');
    else if(v>=MAXBID&&t.hasMax)bad('Team already used its one max bid');
  }
  if(!err&&v>MAXBID)bad(`Max bid is ${full(MAXBID)}`);
  else if(!err&&p&&v<p.base&&v>0)bad(`Below base price (${full(p.base)})`);
  if(!err&&p&&!p.g)msg='⚠ Gender not set: tag it so the 4F/7M rule is checked';
  $('#info').textContent=msg;$('#info').className='info'+(err?' err':'');
  return !err&&!!p&&!!t&&v>0;
}
function pick(){const p=S.players.find(p=>p.id===$('#pl').value);if(p)setPrice(p.base);else setPrice(0)}
function openDrawer(){$('#drawer').classList.add('on');$('#veil').classList.add('on');fillDrawer();pick()}
function closeDrawer(){$('#drawer').classList.remove('on');$('#veil').classList.remove('on')}
function dlg(title,fields,ok){
  return new Promise(res=>{
    $('#dT').textContent=title;
    $('#dB').innerHTML=fields.map(f=>`<div><label>${esc(f.l)}</label>${f.opts?`<select data-k="${f.k}">${f.opts.map(o=>`<option value="${o[0]}"${o[0]===f.v?' selected':''}>${esc(o[1])}</option>`).join('')}</select>`:`<input data-k="${f.k}" type="${f.t||'text'}" value="${esc(f.v||'')}">`}</div>`).join('');
    $('#dOk').textContent=ok||'OK';
    const d=$('#dlg');d.classList.add('on');
    const done=v=>{d.classList.remove('on');$('#dOk').onclick=$('#dNo').onclick=null;res(v)};
    $('#dNo').onclick=()=>done(null);
    $('#dOk').onclick=()=>{const o={};d.querySelectorAll('[data-k]').forEach(e=>o[e.dataset.k]=e.value);done(o)};
    const x=d.querySelector('[data-k]');if(x)x.focus();
  });
}
function validEdit(pid,tid,g){
  const {tm}=derive(),l=S.log.find(x=>x.pid===pid&&x.type==='sold'),t=tm[tid];
  const o=t.roster.filter(r=>r.p.id!==pid);
  const F=o.filter(r=>r.p.g==='F').length+(g==='F'?1:0),M=o.filter(r=>r.p.g==='M').length+(g==='M'?1:0);
  const spent=o.reduce((a,r)=>a+r.price,0)+l.price,slots=SQUAD-o.length-1;
  if(o.length>=SQUAD)return t.name+' squad is full (11)';
  if(spent>t.budget)return t.name+' would be over budget';
  if(t.budget-spent<slots*BASE)return t.name+' could not afford its remaining slots';
  if(F>FEM)return t.name+' would have more than 4 females';
  if(M>MAL)return t.name+' would have more than 7 males';
  if(l.price>=MAXBID&&o.some(r=>r.price>=MAXBID))return t.name+' already used its max bid';
  return '';
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200)}
function record(type){
  const pid=$('#pl').value;if(!pid)return toast('Select a player first');
  const e={id:'l'+Date.now(),type,pid,ts:Date.now()};
  if(type==='sold'){if(!check())return toast('Fix the highlighted issue first');e.tid=$('#tm').value;e.price=+$('#price').value;flashT=e.tid}
  S.log.unshift(e);newId=e.id;save();
  toast(type==='sold'?`${pName(pid)} sold for ${full(e.price)}`:`${pName(pid)} marked unsold`);
  $('#ps').value='';render();pick();
}
/* events */
$('#openBid').onclick=openDrawer;$('#close').onclick=closeDrawer;$('#veil').onclick=closeDrawer;
$('#pl').onchange=pick;$('#tm').onchange=check;$('#price').oninput=check;$('#ps').oninput=()=>{fillDrawer();pick()};
document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>setPrice(Math.min(MAXBID,(+$('#price').value||0)+(+b.dataset.i))));
$('#toBase').onclick=pick;$('#sell').onclick=()=>record('sold');$('#pass').onclick=()=>record('unsold');
$('#q').oninput=e=>{query=e.target.value;renderFeed()};
$('#ft').onchange=e=>{team=e.target.value;renderFeed()};
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;filter=b.dataset.f;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));renderFeed()};
$('#teams').addEventListener('toggle',e=>{const id=e.target.dataset&&e.target.dataset.t;if(!id)return;e.target.open?open.add(id):open.delete(id)},true);
$('#undo').onclick=()=>{if(!S.log.length)return toast('Nothing to undo');const l=S.log.shift();save();render();toast('Undid: '+pName(l.pid))};
$('#addP').onclick=async()=>{const r=await dlg('Add player',[{k:'n',l:'Name'},{k:'a',l:'Age',t:'number',v:'18'},{k:'g',l:'Gender',opts:[['M','Male'],['F','Female']]}],'Add');if(!r)return;const n=r.n.trim(),a=parseInt(r.a,10);if(!n)return toast('Name is required');if(!(a>=13))return toast('Minimum age is 13');S.players.push({id:'p'+Date.now(),name:n,age:a,g:r.g,base:BASE});save();render();toast(n+' added')};
$('#teams').addEventListener('click',async e=>{
  const b=e.target.closest('[data-e]');if(!b)return;
  const pid=b.dataset.e,p=S.players.find(x=>x.id===pid),l=S.log.find(x=>x.pid===pid&&x.type==='sold');if(!p||!l)return;
  const r=await dlg('Edit sold player: '+p.name,[{k:'g',l:'Gender',opts:[['M','Male'],['F','Female']],v:p.g},{k:'t',l:'Team',opts:S.teams.map(t=>[t.id,t.name]),v:l.tid}],'Save');
  if(!r)return;
  const m=validEdit(pid,r.t,r.g);if(m)return toast(m);
  p.g=r.g;l.tid=r.t;flashT=r.t;save();render();toast(p.name+' updated');
});
$('#maxB').onclick=()=>setPrice(MAXBID);
$('#stepB').onclick=()=>setPrice(stepUp(+$('#price').value||0));
const setG=g=>{const p=S.players.find(p=>p.id===$('#pl').value);if(!p)return;p.g=g;save();render()};
$('#gF').onclick=()=>setG('F');$('#gM').onclick=()=>setG('M');
$('#teams').addEventListener('click',async e=>{const b=e.target.closest('[data-b]');if(!b)return;const t=S.teams.find(t=>t.id===b.dataset.b);const r=await dlg('Budget: '+t.name+' (950000 if one owner plays, 875000 if two)',[{k:'v',l:'Total budget (points)',t:'number',v:String(t.budget)}],'Save');if(!r)return;const v=parseInt(r.v,10);if(v>0){t.budget=v;save();render()}});
$('#reset').onclick=async()=>{const r=await dlg('Reset the whole auction? All sales and rosters will be cleared.',[],'Reset');if(r){S=seed();save();open.clear();render();toast('Auction reset')}};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
window.addEventListener('storage',e=>{if(!DOC&&e.key===KEY){load();render()}});
document.body.classList.add('ro');render();
(async()=>{
  const c=FIREBASE_CONFIG;
  if(!c.apiKey||!c.databaseURL){load();canWrite=true;setMode('LOCAL TEST MODE · NOT SYNCED');render();return}
  const B='https://www.gstatic.com/firebasejs/10.12.2/';
  let A,D,T;
  try{[A,D,T]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-database.js'),import(B+'firebase-auth.js')])}
  catch(e){setMode('OFFLINE');toast('Could not load Firebase');return}
  const app=A.initializeApp(c),db=D.getDatabase(app),auth=T.getAuth(app),r=D.ref(db,'auction/state');
  let empty=false;
  DOC=v=>D.set(r,v);
  setMode('VIEW ONLY · LIVE');
  const hb=$('#hostBtn');hb.style.display='';
  hb.onclick=async()=>{
    if(canWrite){await T.signOut(auth);return}
    const x=await dlg('Host login',[{k:'e',l:'Email',t:'email'},{k:'p',l:'Password',t:'password'}],'Log in');
    if(!x)return;
    try{await T.signInWithEmailAndPassword(auth,x.e.trim(),x.p)}catch(err){toast('Login failed')}
  };
  T.onAuthStateChanged(auth,u=>{
    canWrite=!!u;setMode(canWrite?'HOST · SYNCED':'VIEW ONLY · LIVE');
    hb.textContent=canWrite?'Host logout':'Host login';
    if(canWrite&&empty)save();
  });
  D.onValue(r,s=>{
    if(canWrite&&(writing||pend))return;
    const v=s.val();empty=!v;
    if(v){S={teams:v.teams||[],players:v.players||[],log:v.log||[]};render()}
    else if(canWrite)save();
  },e=>toast('Live sync lost: '+((e&&e.code)||'error')));
})();
